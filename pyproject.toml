[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undatum"
version = "1.7.0"
description = "A powerful command-line tool for data processing and analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ivan Begtin", email = "ivan@begtin.tech"}
]
keywords = ["json", "jsonl", "csv", "bson", "cli", "dataset", "data-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Topic :: Terminals",
    "Topic :: Text Processing",
    "Topic :: Utilities"
]
dependencies = [
    "avro>=1.10.2",
    "chardet>=5.2.0",
    "dnspython>=2.6.1",
    "duckdb",
    "elasticsearch",
    "iterabledata>=1.0.18",
    "jsonlines>=4.0.0",
    "lz4>=4.3.2",
    "numpy>=1.22.2",
    "openpyxl>=3.1.2",
    "orjson>=3.9.8",
    "pandas>=2.0.3",
    "pyarrow>=14.0.0",
    "py7zr>=0.20.6",
    "pydantic",
    "pymongo>=4.5.0",
    "pyorc>=0.8.0",
    "python-docx>=0.8.11",
    "pyyaml",
    "pyzstd",
    "qddate>=1.0.4",
    "requests",
    "rich>=13.6.0",
    "tabulate>=0.8.7",
    "tqdm",
    "typer",
    "validators>=0.22.0",
    "xlrd>=2.0.1",
    "xlwt",
    "xmltodict>=0.13.0",
    "xxhash",
    "zipp>=3.19.1",
]

[project.urls]
Homepage = "https://github.com/datenoio/undatum"
Documentation = "https://datenoio.github.io/undatum/"
Repository = "https://github.com/datenoio/undatum"
Changelog = "https://github.com/datenoio/undatum/blob/master/CHANGELOG.md"
Issues = "https://github.com/datenoio/undatum/issues"

[project.optional-dependencies]
extract = [
    "pdfplumber",
    "pdf2image",
    "pytesseract",
    "textract",
]
api = [
    "fastapi",
    "uvicorn",
    "httpx",
]
plot = [
    "matplotlib",
]
tui = [
    "textual>=0.80",
]
web = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "httpx",
]
mcp = [
    "mcp",
]
langchain = [
    "langchain-core",
]
polars = [
    "polars",
]
dask = [
    "dask[dataframe]",
]
s3 = [
    "boto3",
]
gcs = [
    "fsspec",
    "gcsfs",
]
azure = [
    "fsspec",
    "adlfs",
]
cloud = [
    "fsspec",
    "s3fs",
    "gcsfs",
    "adlfs",
]
frictionless = [
    "frictionless>=5.0",
]
postgres = [
    "psycopg2-binary",
]
mysql = [
    "pymysql",
]
mssql = [
    "pyodbc",
]
clickhouse = [
    "clickhouse-driver",
]
lakehouse = [
    "iterabledata[lakehouse]",
]
gis = [
    "iterabledata[geospatial]",
    "iterabledata[lidar]",
]
scientific = [
    "iterabledata[mat]",
    "iterabledata[geophysical]",
    "iterabledata[hdf5]",
]
access = [
    "iterabledata[access]",
]
compression = [
    "iterabledata[compression]",
]
dev = [
    "black",
    "ruff",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[project.scripts]
undatum = "undatum.__main__:main"
data = "undatum.__main__:main"
undatum-mcp = "undatum.mcp.server:main"

[tool.setuptools.packages.find]
include = ["undatum*"]

[tool.setuptools.package-data]
"undatum.templates" = ["*.yml"]
"undatum.recipes" = ["*.yml"]
"undatum.web" = ["templates/*.html", "static/*"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/undatum.1"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
# Plugin base classes intentionally provide optional no-op hooks
"undatum/plugins/base.py" = ["B024", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["undatum"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chardet.*",
    "click.*",
    "jsonlines.*",
    "openpyxl.*",
    "orjson.*",
    "pandas.*",
    "pymongo.*",
    "qddate.*",
    "tabulate.*",
    "validators.*",
    "xlrd.*",
    "xmltodict.*",
    "rich.*",
    "duckdb.*",
    "pyzstd.*",
    "pydantic.*",
    "typer.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
