name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff black
    - name: Ruff
      run: ruff check undatum/ tests/
    - name: Black
      run: black --check undatum/ tests/

  type-check:
    runs-on: ubuntu-latest
    # Advisory until the mypy error backlog is paid down (tracked in
    # dev/docs/IMPROVEMENT_PLAN_2026-06.md, workstream B1)
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install package and mypy
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install mypy
    - name: Mypy
      run: mypy undatum/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api]"
        pip install pytest pytest-benchmark pytest-cov
    - name: Run tests with coverage
      run: |
        pytest --cov=undatum --cov-report=term --cov-fail-under=50

  install-gate:
    name: Clean wheel install smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel
    - name: Install wheel in clean venv and smoke-test
      run: |
        python -m venv /tmp/undatum-smoke
        /tmp/undatum-smoke/bin/pip install --upgrade pip
        /tmp/undatum-smoke/bin/pip install dist/*.whl
        /tmp/undatum-smoke/bin/python -c "import chardet, xmltodict, pyarrow, undatum"
        /tmp/undatum-smoke/bin/undatum --help
        # Core format smoke: convert / stats / validate
        printf 'name,age\nAlice,30\nBob,25\n' > /tmp/sample.csv
        /tmp/undatum-smoke/bin/undatum convert /tmp/sample.csv /tmp/sample.parquet --no-progress
        /tmp/undatum-smoke/bin/undatum convert /tmp/sample.csv /tmp/sample.jsonl --no-progress
        /tmp/undatum-smoke/bin/undatum stats /tmp/sample.csv --limit 10
        /tmp/undatum-smoke/bin/undatum validate /tmp/sample.csv || true
        # gzip codec must be import-routable (engine selector smoke)
        /tmp/undatum-smoke/bin/python -c "from undatum.constants import DUCKABLE_CODECS; assert 'gz' in DUCKABLE_CODECS"
