name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    name: Single-binary artifacts
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: undatum-linux-x86_64
          - os: macos-latest
            artifact: undatum-macos
          - os: windows-latest
            artifact: undatum-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[s3]"
          pip install pyinstaller
      - name: Assert PyInstaller spec is present
        shell: bash
        run: test -f packaging/undatum.spec
      - name: Build binary
        run: pyinstaller --noconfirm packaging/undatum.spec
      - name: Smoke-test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN=dist/undatum
          "$BIN" --help
          printf 'name,age\nAlice,30\n' > /tmp/sample.csv
          "$BIN" convert /tmp/sample.csv /tmp/sample.jsonl --no-progress
      - name: Smoke-test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "dist/undatum.exe"
          & $bin --help
          Set-Content -Path sample.csv -Value "name,age`nAlice,30"
          & $bin convert sample.csv sample.jsonl --no-progress
      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/undatum.exe ]; then
            mv dist/undatum.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/undatum "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
